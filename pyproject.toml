[project]
name = "ddns-updater"
version = "0.1.0"
description = "Dynamic DNS updater that monitors local IP changes and syncs them to Cloudflare DNS."
readme = "README.md"
authors = [{ name = "ExplodingONC", email = "zhangxinyue9825@hotmail.com" }]
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "psutil>=7.0.0",
    "cloudflare>=5.4.0",
    "requests>=2.31.0",
]

[project.scripts]
ddns-updater = "ddns_updater.ddns_updater:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddns_updater"]
